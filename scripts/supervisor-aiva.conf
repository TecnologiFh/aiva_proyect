[program:aiva-horizon]
process_name=%(program_name)s
command=php /var/www/aiva/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/aiva/storage/logs/horizon.log
stopwaitsecs=120

[program:aiva-scheduler]
process_name=%(program_name)s
command=php /var/www/aiva/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/aiva/storage/logs/scheduler.log
stopwaitsecs=60
